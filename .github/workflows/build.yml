name: Build and audit Windows launcher
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  display:
    name: Display scaling (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test actual Windows child-process DPI behavior
        shell: powershell
        run: ./tools/TestLauncherDisplay.ps1
      - name: Test executable layout detection without game files
        shell: powershell
        run: ./tools/TestGameCompatibility.ps1
      - name: Test launcher Steam routing without game files
        shell: powershell
        run: ./tools/TestSteamLaunch.ps1
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc,x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: work/motion-target
      - name: Install build tools
        run: python -m pip install -r requirements-build.txt
      - name: Build and audit (no game files)
        shell: powershell
        run: ./tools/BuildRelease.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: BullySkate-Windows
          path: release/*.zip
