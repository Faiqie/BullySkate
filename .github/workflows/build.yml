name: Build and audit Windows launcher
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc,x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: work/motion-target
      - name: Install build tools
        run: python -m pip install -r requirements-build.txt
      - name: Build and audit (no game files)
        shell: powershell
        run: ./tools/BuildRelease.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: BullySkate-Windows
          path: release/*
