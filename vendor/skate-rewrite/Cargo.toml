[workspace]
members = ["crates/skate-core", "crates/skate-data", "crates/skate-dynamics", "crates/skate-net"]
resolver = "3"
[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
skate-core = { path = "crates/skate-core" }
skate-data = { path = "crates/skate-data" }
